# SIMULATED LAB: 4 nodes x 8 GPUs, the same shape the scheduler simulation uses.
ClusterName=homelab-sim
SlurmctldHost=ctl0
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu
HealthCheckProgram=/usr/local/bin/node-agent-healthcheck
HealthCheckInterval=60
NodeName=gpu[0-3] CPUs=64 RealMemory=512000 Gres=gpu:h100:8 State=UNKNOWN
PartitionName=gpu Nodes=gpu[0-3] Default=YES MaxTime=24:00:00 State=UP
